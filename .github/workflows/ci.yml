name: ci

on:
  pull_request:
    branches: [dev, qa, production]
  push:
    branches: [dev, qa, production]

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on dev, qa and production are never cancelled
# (every commit there must end with a ci/images result, because images and release tags point at its SHA).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secrets and dependencies: gitleaks over the whole history and Trivy over the file system (V-03).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Secret scan with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

      # trivy-action v0.36.0 runs Trivy 0.70.0, the same version as the image scan (build-images.sh).
      - name: Trivy filesystem scan (V-03)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: '**/target'

  # Lint of the committed API contracts (RNF-10, V-02). That the running services match them is checked by the
  # *ContractIT tests of the `functional` job.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASYNCAPI_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.12.0'

      - name: Lint OpenAPI (Redocly CLI)
        run: npx --yes @redocly/cli@2.83.0 lint docs/openapi/*.yaml --max-problems=0

      - name: Validate AsyncAPI (AsyncAPI CLI)
        run: |
          for f in docs/asyncapi/*.yaml; do
            npx --yes @asyncapi/cli@6.3.1 validate "$f" --fail-severity=info
          done

  # UT: unit tests of every module (surefire, *Test), fast feedback without Docker. JaCoCo is off here on purpose: the
  # 70 % gate measures unit + integration tests together (yawar-platform alone reaches 61 % with unit tests only), so it
  # is enforced in `functional`.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # One reactor build from the root aggregator pom: yawar-platform first, then every service.
      - name: Unit tests
        run: ./mvnw -B -ntp verify -DskipITs -Djacoco.skip=true

      - name: Test summary
        if: ${{ !cancelled() }}
        run: .github/scripts/test-summary.sh surefire "Unit tests (surefire)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: unit-test-reports
          path: '*/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  # FT: integration, acceptance (one per Gherkin scenario) and contract tests (failsafe, *IT, Testcontainers: Docker is
  # available on ubuntu-latest). It runs the whole `verify`, so the unit tests (seconds) run again in the same build and
  # JaCoCo merges both into the line coverage gate of each module (V-01, RNF-11).
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Integration, acceptance and contract tests (coverage ≥ 70 %, V-01)
        run: ./mvnw -B -ntp verify

      - name: Test summary
        if: ${{ !cancelled() }}
        run: .github/scripts/test-summary.sh failsafe "Functional tests (failsafe, *IT / *AcceptanceIT / *ContractIT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: .github/scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: functional-test-reports
          path: |
            */target/failsafe-reports/
            */target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-reports
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore
          retention-days: 14

  # Gate: the required status check `ci` (rulesets). It passes only when security, unit and functional all passed;
  # `if: always()` makes it report a failure instead of being skipped when one of them fails (a skipped required check
  # would count as passed). `e2e` is reported on its own and is not part of the gate yet.
  ci:
    needs: [security, unit, functional]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have passed
        env:
          SECURITY: ${{ needs.security.result }}
          UNIT: ${{ needs.unit.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
        run: |
          {
            echo "### ci gate"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| security (gitleaks, Trivy) | ${SECURITY} |"
            echo "| unit (UT) | ${UNIT} |"
            echo "| functional (FT, coverage gate) | ${FUNCTIONAL} |"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$SECURITY" "$UNIT" "$FUNCTIONAL"; do
            [ "$result" = success ] || { echo "A required job did not succeed (security=$SECURITY unit=$UNIT functional=$FUNCTIONAL)"; exit 1; }
          done

  # E2E (YAW-47): the real stack from docker compose (profile platform: config-server, Eureka, API Gateway, ms-donors and
  # PostgreSQL, RabbitMQ, Redis, Keycloak), then the REST Assured tests of e2e-tests/ through the gateway.
  # Not started: Mailpit and the Grafana stack (not needed), Samba AD. config-server reads deploy/local/e2e-config because
  # the real config repository (yawar-uce/yawar-config) is private. All secrets of the run are random.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create deploy/local/.env with random secrets
        run: .github/scripts/e2e-env.sh

      - name: Start the stack
        run: |
          docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml --profile platform \
            up -d --build --wait --wait-timeout 600 \
            postgres rabbitmq redis keycloak config-server discovery-service ms-donors api-gateway

      - name: Import the Keycloak realm
        run: make keycloak-import

      # Waits (up to 150 s) until the gateway reaches ms-donors through Eureka before the first test.
      - name: End-to-end tests
        run: make e2e

      - name: Test summary
        if: ${{ !cancelled() }}
        run: .github/scripts/test-summary.sh failsafe "End-to-end tests (REST Assured through the API Gateway)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-test-reports
          path: e2e-tests/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      # Secrets of deploy/local/.env are replaced by *** in the output.
      - name: Container status and logs
        if: ${{ failure() }}
        run: .github/scripts/e2e-logs.sh 200

      - name: Stop the stack and delete its volumes
        if: ${{ always() }}
        run: docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml --profile '*' down --volumes --remove-orphans

  # Load (YAW-48, V-05): k6 smoke (20 users x 1 min) on GET /api/v1/donors/me through the gateway, against its own
  # copy of the e2e stack. Fails on p95 >= 3 s or errors >= 1 %. Reported on its own, not part of the gate.
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Create deploy/local/.env with random secrets
        run: .github/scripts/e2e-env.sh

      - name: Start the stack
        run: |
          docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml --profile platform \
            up -d --build --wait --wait-timeout 600 \
            postgres rabbitmq redis keycloak config-server discovery-service ms-donors api-gateway

      - name: Import the Keycloak realm
        run: make keycloak-import

      - name: Smoke load test (k6)
        timeout-minutes: 3
        run: make load PROFILE=smoke

      - name: Load summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f load-tests/results/summary.md ]; then
            cat load-tests/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload k6 reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: load-test-reports
          path: load-tests/results/
          if-no-files-found: ignore
          retention-days: 14

      # Secrets of deploy/local/.env are replaced by *** in the output.
      - name: Container status and logs
        if: ${{ failure() }}
        run: .github/scripts/e2e-logs.sh 200

      - name: Stop the stack and delete its volumes
        if: ${{ always() }}
        run: |
          if [ -f deploy/local/.env ]; then
            docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml --profile '*' down --volumes --remove-orphans
          fi

  # Docker image of every module with a Dockerfile + Trivy image scan (V-03). No push: CD (YAW-16) pushes to ECR.
  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Day of the Trivy database cache
        id: day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # One cache entry per day (the database is updated daily), restored from the latest one otherwise.
      - name: Cache Trivy vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Build images and scan them with Trivy
        env:
          TAG: ${{ github.sha }}
        run: .github/scripts/build-images.sh
