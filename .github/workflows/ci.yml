name: ci

on:
  pull_request:
    branches: [dev, qa, production]
  push:
    branches: [dev, qa, production]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # One reactor build from the root aggregator pom: yawar-platform first, then every service.
      # verify = unit tests + integration tests (Testcontainers, Docker is available on ubuntu-latest)
      # + JaCoCo report and the 70 % gate of each module (V-01).
      - name: Build and test every module (coverage ≥ 70 %, V-01)
        run: ./mvnw -B -ntp verify

      - name: Trivy filesystem scan (V-03)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
