# config-server (YAW-216). Every value that changes per environment comes from an environment variable;
# secrets (Git token, passwords) only from env / Kubernetes Secrets, never from this file.
server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    # git = private repo yawar-uce/yawar-config (qa, production, demo) · native = local folder (dev without token)
    active: ${CONFIG_SERVER_PROFILES:git}
  threads:
    virtual:
      enabled: true
  # Users come from CONFIG_SERVER_USER/PASSWORD (read config) and CONFIG_ADMIN_USER/PASSWORD (bus refresh);
  # see SecurityConfig. No defaults: a missing value stops the startup.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}   # no default: yawar-dev, yawar-qa, yawar-production per environment
  cloud:
    bus:
      enabled: true
    config:
      server:
        # Config endpoints live under /config so they never clash with /health/** and /actuator/**.
        # Clients: spring.config.import=configserver:http://<host>:8888/config
        prefix: /config
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/yawar-uce/yawar-config.git}
          username: ${CONFIG_GIT_USERNAME:x-access-token}
          password: ${CONFIG_GIT_TOKEN:}
          default-label: ${CONFIG_GIT_LABEL:main}
          clone-on-start: true
          force-pull: true
          timeout: 10
          basedir: ${java.io.tmpdir}/yawar-config
        native:
          search-locations: ${CONFIG_NATIVE_DIR:file:../yawar-config}

# Actuator at the root: /health/live and /health/ready (Kubernetes probes), /busrefresh, /info.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,busrefresh
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized   # full /health with components for the admin user only
      roles: CONFIG_ADMIN
      group:
        live:
          include: livenessState
        ready:
          # Serving config does not need RabbitMQ (only /busrefresh does): a broker outage must not stop
          # new pods from importing their configuration. Rabbit stays visible in the full /health.
          include: readinessState
