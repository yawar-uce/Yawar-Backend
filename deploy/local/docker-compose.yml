# Yawar local environment: shared infrastructure for development.
# Use the Makefile at the repository root (`make up`, `make ps`, `make down`, `make reset`).
# Optional profiles: `platform` (config-server, discovery-service, api-gateway, ms-donors; `make up PROFILE=platform`),
# `ad` (Samba AD), `idp-mock` (OIDC stub that stands in for Google in `make keycloak-check`; `make up PROFILE=idp-mock`), `gateway` (config-server, discovery-service and the API Gateway only).

name: ${COMPOSE_PROJECT_NAME:-yawar}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      DONORS_DB_NAME: ${DONORS_DB_NAME}
      DONORS_DB_USER: ${DONORS_DB_USER}
      DONORS_DB_PASSWORD: ${DONORS_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP (not the socket) so the temporary init server never counts; and both databases must exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" && for d in \"$$DONORS_DB_NAME\" \"$$KEYCLOAK_DB_NAME\"; do PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$d\" -tAc 'select 1' >/dev/null || exit 1; done"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    entrypoint: ["/bin/sh", "/opt/yawar/rabbitmq-entrypoint.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      YAWAR_VHOSTS: ${RABBITMQ_VHOSTS}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq-entrypoint.sh:/opt/yawar/rabbitmq-entrypoint.sh:ro
    healthcheck:
      # Healthy only once the broker answers AND the default user has access to every Yawar vhost.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity && for v in $$YAWAR_VHOSTS; do rabbitmqctl -q list_permissions -p \"$$v\" 2>/dev/null | grep -q \"^$$RABBITMQ_DEFAULT_USER\" || exit 1; done"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  # Redis 8 for the API Gateway rate limiter (YAW-33); later also Idempotency-Key and notification state. The password
  # is passed through the environment (not on the command line shown by `ps`); data is kept in a volume (AOF).
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: query the management interface (port 9000) with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Applies deploy/keycloak/realms/<realm>.yaml to Keycloak (idempotent: re-running updates the realm) and exits.
  # `make keycloak-import` re-applies it after editing the file. Secrets (Google) only from deploy/local/.env.
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.6.0-26.8.1
    restart: "no"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/${KC_IMPORT_REALM:-yawar-dev}.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_MANAGED_REQUIRED_ACTION: no-delete
      KC_WEB_URL: ${KC_WEB_URL:-http://localhost:5173}
      KC_SMTP_HOST: mailpit
      KC_SMTP_PORT: "1025"
      KC_GOOGLE_ENABLED: ${KC_GOOGLE_ENABLED:-false}
      KC_GOOGLE_CLIENT_ID: ${KC_GOOGLE_CLIENT_ID:-not-configured}
      KC_GOOGLE_CLIENT_SECRET: ${KC_GOOGLE_CLIENT_SECRET:-not-configured}
    volumes:
      - ../keycloak/realms:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # Test-only OIDC identity provider (stands in for Google, HU-02): interactive login where the claims
  # (email, given_name, ...) are typed in a form. Used only by deploy/keycloak/test_realm.py; never in a realm file.
  idp-mock:
    profiles: ["idp-mock"]
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    restart: "no"
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "127.0.0.1:${IDP_MOCK_PORT:-8099}:8080"

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Local observability: OpenTelemetry Collector + Grafana with Tempo (traces), Loki (logs) and
  # Prometheus (metrics) in one container. Services export OTLP to localhost:4317 (gRPC) / 4318 (HTTP).
  # Grafana allows anonymous admin access, so it is bound to 127.0.0.1 only.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - otel-lgtm-data:/data
    healthcheck:
      # Script shipped in the image: waits for the ready file, then checks Grafana, Loki, Tempo,
      # Prometheus and the collector.
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Eureka server (YAW-217). Dashboard http://localhost:8761 (EUREKA_USER / EUREKA_PASSWORD). It imports its
  # configuration from config-server when that is running (optional import) and starts without it otherwise.
  discovery-service:
    profiles: ["platform", "gateway"]
    build:
      context: ../../discovery-service
    image: yawar/discovery-service:local
    restart: unless-stopped
    environment:
      EUREKA_USER: ${EUREKA_USER:?set EUREKA_USER in deploy/local/.env (see .env.example)}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?set EUREKA_PASSWORD in deploy/local/.env}
      EUREKA_SELF_PRESERVATION: "false"
      CONFIG_SERVER_URL: http://config-server:8888/config
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:${DISCOVERY_PORT:-8761}:8761"
    depends_on:
      config-server:        # so the optional import really finds its configuration
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
  # Spring Cloud Config Server (YAW-216). Built from ../../config-server. CONFIG_SERVER_PROFILES=native reads the
  # local clone ../../../yawar-config (~/yawar/yawar-config); =git reads yawar-uce/yawar-config with CONFIG_GIT_TOKEN.
  config-server:
    profiles: ["platform", "gateway"]
    build:
      context: ../../config-server
    image: yawar/config-server:local
    restart: unless-stopped
    environment:
      CONFIG_SERVER_PROFILES: ${CONFIG_SERVER_PROFILES:-native}
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:?set CONFIG_SERVER_USER in deploy/local/.env (see .env.example)}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?set CONFIG_SERVER_PASSWORD in deploy/local/.env}
      CONFIG_ADMIN_USER: ${CONFIG_ADMIN_USER:?set CONFIG_ADMIN_USER in deploy/local/.env}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD:?set CONFIG_ADMIN_PASSWORD in deploy/local/.env}
      CONFIG_NATIVE_DIR: file:/config-repo
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/yawar-uce/yawar-config.git}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-x-access-token}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: yawar-dev
    ports:
      - "127.0.0.1:${CONFIG_SERVER_PORT:-8888}:8888"
    volumes:
      - ${YAWAR_CONFIG_DIR:-../../../yawar-config}:/config-repo:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s

  # ms-donors (YAW-36). Uses donors_db in the shared local PostgreSQL (one database + owner role per service;
  # separate instances on AWS). Imports its configuration from config-server when it is running (optional).
  ms-donors:
    profiles: ["platform"]
    build:
      context: ../..
      dockerfile: ms-donors/Dockerfile
    image: yawar/ms-donors:local
    restart: unless-stopped
    environment:
      YAWAR_ENV: dev
      CONFIG_SERVER_URL: http://config-server:8888/config
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-}
      DONORS_DB_URL: jdbc:postgresql://postgres:5432/${DONORS_DB_NAME}
      DONORS_DB_USER: ${DONORS_DB_USER}
      DONORS_DB_PASSWORD: ${DONORS_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: yawar-dev
      # The token's iss is what the browser sees (localhost); the keys come from the container network.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8080}/realms/yawar-dev
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/yawar-dev/protocol/openid-connect/certs
      EUREKA_HOST: discovery-service
      EUREKA_USER: ${EUREKA_USER:?set EUREKA_USER in deploy/local/.env (see .env.example)}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?set EUREKA_PASSWORD in deploy/local/.env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "127.0.0.1:${DONORS_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 60s

  # API Gateway (YAW-33): the single entry point, http://localhost:8000/api/v1/... Validates Keycloak JWTs, role-based
  # access, 60 requests/minute per user (Redis), CORS and circuit breaker; routes lb://ms-donors through Eureka.
  api-gateway:
    profiles: ["gateway", "platform"]
    build:
      context: ../../api-gateway
    image: yawar/api-gateway:local
    restart: unless-stopped
    environment:
      YAWAR_ENV: dev
      CONFIG_SERVER_URL: http://config-server:8888/config
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: yawar-dev
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      # The token's iss is what the browser sees (localhost); the keys come from the container network.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8080}/realms/yawar-dev
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/yawar-dev/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:[*],http://localhost,https://localhost,capacitor://localhost}"
      EUREKA_HOST: discovery-service
      EUREKA_USER: ${EUREKA_USER:?set EUREKA_USER in deploy/local/.env (see .env.example)}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?set EUREKA_PASSWORD in deploy/local/.env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  mailpit-data:
  otel-lgtm-data:
