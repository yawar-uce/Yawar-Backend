# Realm yawar-qa (QA, AWS account A — https://yawar-qa-<ip>.sslip.io) — imported by keycloak-config-cli (YAW-31, EP-07 RF-01..RF-06).
# Values in $(env:...) come from the QA Secret / Helm values (KC_WEB_URL = https://yawar-qa-<ip>.sslip.io); secrets (Google client secret) never live in this file.
realm: yawar-qa
enabled: true
displayName: Yawar
displayNameHtml: "<b>Yawar</b>"

# --- Sign-up and login (RF-01, RF-02, RF-06) ---
registrationAllowed: true
registrationEmailAsUsername: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
verifyEmail: true
resetPasswordAllowed: true
rememberMe: false
editUsernameAllowed: false
# QA is served over HTTPS (cert-manager, YAW-215).
sslRequired: external

# --- Credentials (RNF-01: Keycloak hashes with Argon2) and brute-force protection ---
passwordPolicy: "length(10) and notUsername and notEmail and passwordHistory(3)"
bruteForceProtected: true
failureFactor: 5
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900

# --- Short-lived tokens (RNF-01) ---
accessTokenLifespan: 300
ssoSessionIdleTimeout: 1800
ssoSessionMaxLifespan: 36000
revokeRefreshToken: true
refreshTokenMaxReuse: 0

# --- Spanish UI, English as second language ---
internationalizationEnabled: true
supportedLocales: [es, en]
defaultLocale: es
messageBundles:
  es:
    privacyConsent: "Consentimiento de datos personales"
    privacyConsentAccepted: "Acepto el tratamiento de mis datos personales por Yawar según la LOPDP"
    privacyConsentRequired: "Necesitamos tu consentimiento para tratar tus datos (LOPDP) y crear tu cuenta."
    emailExistsMessage: "Este correo ya está registrado. Inicia sesión o recupera tu contraseña."
    usernameExistsMessage: "Este correo ya está registrado. Inicia sesión o recupera tu contraseña."
    error-user-attribute-required: "Necesitamos tu consentimiento para tratar tus datos (LOPDP) y crear tu cuenta."
  en:
    privacyConsent: "Personal data consent"
    privacyConsentAccepted: "I accept the processing of my personal data by Yawar under the LOPDP"
    privacyConsentRequired: "We need your consent to process your data (LOPDP) and create your account."
    emailExistsMessage: "This email is already registered. Sign in or recover your password."
    usernameExistsMessage: "This email is already registered. Sign in or recover your password."
    error-user-attribute-required: "We need your consent to process your data (LOPDP) and create your account."

# --- Email: in-cluster Mailpit in QA (no real mail is sent) ---
smtpServer:
  host: "$(env:KC_SMTP_HOST:-mailpit)"
  port: "$(env:KC_SMTP_PORT:-1025)"
  from: "$(env:KC_SMTP_FROM:-no-reply@yawar-qa.local)"
  fromDisplayName: Yawar
  auth: "false"
  ssl: "false"
  starttls: "false"

# --- Roles (YAW-DOC-07, security skill). New self-registered users get "donor" only. ---
roles:
  realm:
    - name: donor
      description: Blood donor (self-registered)
    - name: recruitment
      description: Recruitment staff (campaigns, donation points)
    - name: logistics
      description: Logistics staff (inventory, cold chain, dispatch)
    - name: hospital
      description: Hospital user (blood requests)
    - name: administrator
      description: Platform administrator
    - name: auditor
      description: Auditor (read-only access logs and traceability)
    - name: agent
      description: Service role of the AI agent (MCP tools)
    # Default role of the realm: what every new user (self-registered or Google) receives.
    - name: default-roles-yawar-qa
      description: Roles of every new user
      composite: true
      composites:
        realm: [donor, uma_authorization]   # no offline_access: no long-lived tokens in the browser
        client:
          account: [view-profile, manage-account]

# --- Public SPA client: Authorization Code + PKCE S256 only (no implicit, no password grant) ---
clients:
  - clientId: yawar-web
    name: Yawar web
    enabled: true
    publicClient: true
    protocol: openid-connect
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: true
    # Least privilege: tokens carry only the realm roles mapped below (scopeMappings), not every role.
    fullScopeAllowed: false
    rootUrl: "$(env:KC_WEB_URL:-https://yawar-qa.invalid)"
    baseUrl: /
    # Exact URIs (the web app, gateway and Keycloak share the QA host): login callback and silent SSO check.
    redirectUris:
      - "$(env:KC_WEB_URL:-https://yawar-qa.invalid)/callback"
      - "$(env:KC_WEB_URL:-https://yawar-qa.invalid)/silent-check-sso.html"
    webOrigins:
      - "$(env:KC_WEB_URL:-https://yawar-qa.invalid)"
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "$(env:KC_WEB_URL:-https://yawar-qa.invalid)/"
    defaultClientScopes: [web-origins, acr, profile, roles, basic, email]
    optionalClientScopes: []
    protocolMappers:
      # Tokens carry the API audience so the API Gateway can reject tokens issued for other clients.
      - name: yawar-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.custom.audience: yawar-api
          access.token.claim: "true"
          id.token.claim: "false"
      # ms-donors records the consent (purpose, policy version, timestamp) when it first sees this claim on
      # GET /donors/me; it is the system of record for consents and revocations (no call to Keycloak, C-02).
      - name: privacy-consent
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: privacy_consent
          claim.name: privacy_consent
          jsonType.label: String
          multivalued: "true"
          access.token.claim: "true"
          id.token.claim: "false"
          userinfo.token.claim: "false"
      # Claim idp = identity provider alias of the session (e.g. google); absent for email + password sign-in.
      # ms-donors uses it only for registrationSource in DonorRegistered.
      - name: identity-provider
        protocol: openid-connect
        protocolMapper: oidc-usersessionmodel-note-mapper
        config:
          user.session.note: identity_provider
          claim.name: idp
          jsonType.label: String
          access.token.claim: "true"
          id.token.claim: "false"
          userinfo.token.claim: "false"

scopeMappings:
  - client: yawar-web
    roles: [donor, recruitment, logistics, hospital, administrator, auditor]

# --- Google sign-in / account linking (HU-02). Disabled until KC_GOOGLE_* are set in .env. ---
identityProviders:
  - alias: google
    providerId: google
    displayName: Google
    enabled: $(env:KC_GOOGLE_ENABLED:-false)
    trustEmail: true
    storeToken: false
    firstBrokerLoginFlowAlias: yawar-first-broker-login
    config:
      clientId: "$(env:KC_GOOGLE_CLIENT_ID:-not-configured)"
      clientSecret: "$(env:KC_GOOGLE_CLIENT_SECRET:-not-configured)"
      defaultScope: openid email profile
      syncMode: IMPORT
      useJwksUrl: "true"

# --- First broker login (HU-02, ADR-046): Google users enter without filling any form, except the single
# privacy-consent checkbox of "review profile" (update.profile.on.first.login = missing; the profile arrives
# prefilled from Google). A new user is created when the email is unique; an existing user is linked only after
# entering that account's password, never automatically (deploy/keycloak/README.md, "Account linking").
authenticationFlows:
  - alias: yawar-first-broker-login
    description: Google sign-in; creates the donor or links it to the existing account safely
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-review-profile
        authenticatorConfig: yawar-review-profile
        requirement: REQUIRED
        priority: 10
        userSetupAllowed: false
        autheticatorFlow: false
      - authenticatorFlow: true
        flowAlias: yawar-user-creation-or-linking
        requirement: REQUIRED
        priority: 20
        userSetupAllowed: false
        autheticatorFlow: true
  - alias: yawar-user-creation-or-linking
    description: Create the user if the email is new, otherwise handle the existing account
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-create-user-if-unique
        authenticatorConfig: yawar-create-user-if-unique
        requirement: ALTERNATIVE
        priority: 10
        userSetupAllowed: false
        autheticatorFlow: false
      - authenticatorFlow: true
        flowAlias: yawar-handle-existing-account
        requirement: ALTERNATIVE
        priority: 20
        userSetupAllowed: false
        autheticatorFlow: true
  - alias: yawar-handle-existing-account
    description: Existing account with the same email; linked only after its password is entered
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-username-password-form
        requirement: REQUIRED
        priority: 10
        userSetupAllowed: false
        autheticatorFlow: false
authenticatorConfig:
  - alias: yawar-review-profile
    config:
      update.profile.on.first.login: missing
  - alias: yawar-create-user-if-unique
    config:
      require.password.update.after.registration: "false"

# --- User profile: privacy consent is required at sign-up and in "review profile" after Google login ---
components:
  org.keycloak.userprofile.UserProfileProvider:
    - providerId: declarative-user-profile
      subComponents: {}
      config:
        kc.user.profile.config:
          - |
            {
              "unmanagedAttributePolicy": "ADMIN_VIEW",
              "attributes": [
                {"name": "username", "displayName": "${username}",
                 "validations": {"length": {"min": 3, "max": 255}, "username-prohibited-characters": {},
                                 "up-username-not-idn-homograph": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                {"name": "email", "displayName": "${email}",
                 "validations": {"email": {}, "length": {"max": 255}},
                 "required": {"roles": ["user"]},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                {"name": "firstName", "displayName": "${firstName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                {"name": "lastName", "displayName": "${lastName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                {"name": "privacy_consent", "displayName": "${privacyConsent}",
                 "validations": {"options": {"options": ["accepted"], "error-message": "${privacyConsentRequired}"}},
                 "annotations": {"inputType": "multiselect-checkboxes",
                                 "inputOptionLabels": {"accepted": "${privacyConsentAccepted}"}},
                 "required": {"roles": ["user"]},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": true}
              ],
              "groups": [
                {"name": "user-metadata", "displayHeader": "User metadata",
                 "displayDescription": "Attributes, which refer to user metadata"}
              ]
            }
