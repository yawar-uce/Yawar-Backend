# Values of the shared chart yawar-service for discovery-service (Eureka, YAW-217). The chart arrives with YAW-13.
nameOverride: discovery-service
image:
  repository: yawar/discovery-service   # ECR repository; the tag is the commit SHA set by CD
replicaCount: 1                          # single registry node per environment (register-with-eureka: false)
containerPort: 8761
service:
  port: 8761                             # ClusterIP; the dashboard is reached with kubectl port-forward
probes:
  liveness: /health/live
  readiness: /health/ready
env:
  CONFIG_SERVER_URL: http://config-server:8888/config
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
# Kubernetes Secret discovery-service-secrets: EUREKA_USER, EUREKA_PASSWORD, CONFIG_SERVER_USER,
# CONFIG_SERVER_PASSWORD (per environment, never committed). Every client service's Secret needs EUREKA_USER and
# EUREKA_PASSWORD too (they build the defaultZone URL): use alphanumeric passwords so the URL never needs encoding.
# YAW-13: a NetworkPolicy lets only pods labelled app.kubernetes.io/part-of=yawar reach port 8761.
envFromSecret: discovery-service-secrets
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
tmpVolume: /tmp
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
