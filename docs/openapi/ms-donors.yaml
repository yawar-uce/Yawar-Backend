components:
  schemas:
    ConsentView:
      description: An active consent
      properties:
        grantedAt:
          description: When the consent was granted
          format: date-time
          type: string
        policyVersion:
          description: Version of the privacy policy that was accepted
          example: 2026-1
          type: string
        purpose:
          description: Purpose the donor consented to
          enum:
          - DATA_PROCESSING
          type: string
      type: object
    DonorResponse:
      description: The caller's donor profile with its active consents
      properties:
        consents:
          description: "Active consents, one per purpose"
          items:
            $ref: "#/components/schemas/ConsentView"
          type: array
        id:
          description: Donor id
          format: uuid
          type: string
        profileComplete:
          description: True once the profile data has been completed
          type: boolean
      type: object
    ProblemDetail:
      properties:
        detail:
          type: string
        instance:
          format: uri
          type: string
        properties:
          additionalProperties: {}
          type: object
        status:
          format: int32
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
      type: object
  securitySchemes:
    keycloak:
      bearerFormat: JWT
      description: "Keycloak access token (Authorization Code + PKCE), audience yawar-api"
      scheme: bearer
      type: http
info:
  description: |-
    Donor profile, consents (LOPDP) and eligibility. Reached through the API Gateway.

    Implemented: `GET /api/v1/donors/me`. The donor's consents are returned inside that response; `PUT /api/v1/donors/me` (If-Match) and `POST /api/v1/donors/me/consents` are planned (HU-02..HU-05) and not part of this contract yet.
  title: ms-donors API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/donors/me:
    get:
      description: "Returns the caller's donor profile, found by the token's `sub`\
        \ (never by an id in the path). The first call creates it when the token carries\
        \ `privacy_consent=accepted`. The active consents are part of this response."
      operationId: getMyDonorProfile
      parameters:
      - description: ETag of a previous response; a match answers 304
        in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorResponse"
          description: The caller's donor profile
          headers:
            ETag:
              description: "Profile version, e.g. \"0\"; send it back as If-None-Match"
              schema:
                type: string
              style: simple
        "304":
          description: If-None-Match matches the current version; no body
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "401":
          description: "Missing or invalid token; empty body, WWW-Authenticate header"
        "403":
          description: The token has no donor role; empty body
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The token carries no accepted privacy consent; nothing is stored
      summary: Own donor profile; created on the first call from the privacy consent
        in the token
      tags:
      - Donors
security:
- keycloak: []
servers:
- description: API Gateway (local; every environment uses its own host)
  url: http://localhost:8000
